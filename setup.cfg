[metadata]
name = wittsmith-ai-model
version = 0.1.0
description = A small, explicit GRU dialogue-model training and inference project
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
python_requires = >=3.9
install_requires =
    torch==2.8.0
    lightning==2.6.0
    datasets==3.6.0
    gensim==4.4.0
    jieba==0.42.1
    PyYAML==6.0.3

[options.packages.find]
include = ai_model*

[options.entry_points]
console_scripts =
    ai-model = ai_model.cli:main
